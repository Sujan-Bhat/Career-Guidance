services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    # Dockerfile default is gunicorn + config.settings.prod; command/DEBUG
    # overrides here pin the stack to the audited prod configuration.
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DEBUG: "False"
      MONGO_URI: mongodb://mongo:27017
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/2
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: celery -A config worker -l info
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      MONGO_URI: mongodb://mongo:27017
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # runs CELERY_BEAT_SCHEDULE (nightly Eq. 2 weight recalibration at 03:00)
  beat:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: celery -A config beat -l info
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      MONGO_URI: mongodb://mongo:27017
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ../frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      web:
        condition: service_started

volumes:
  mongo_data:
